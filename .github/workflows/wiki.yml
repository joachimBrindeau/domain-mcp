name: Wiki

on:
  push:
    branches: [main]
    paths:
      - 'packages/domain-mcp/src/**'
      - 'packages/domain-mcp/scripts/wiki.mjs'
      - 'packages/domain-mcp/package.json'
      - 'packages/wiki/**'
      - 'icon.png'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/wiki.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/domain-mcp/src/**'
      - 'packages/domain-mcp/scripts/wiki.mjs'
      - 'packages/domain-mcp/package.json'
      - 'packages/wiki/**'
      - 'icon.png'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build generated wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run wiki:check
      - run: pnpm --filter domain-mcp-wiki run build

      - name: Generate native GitHub Wiki
        if: github.event_name != 'pull_request'
        run: node packages/domain-mcp/scripts/wiki.mjs --github-output=.github-wiki

      - name: Publish native GitHub Wiki
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" .github-wiki-repository
          find .github-wiki-repository -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R .github-wiki/. .github-wiki-repository/
          cd .github-wiki-repository
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git diff --cached --quiet || git commit -m "docs: sync MCP runtime surface"
          git push

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/wiki/build

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
